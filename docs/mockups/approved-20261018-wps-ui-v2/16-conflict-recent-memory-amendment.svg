<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f3f7f5"/><g font-family="Microsoft YaHei,sans-serif" fill="#244235"><text x="40" y="45" font-size="25" font-weight="bold">16 · 分类冲突按最近学习经验预填（2026-10-20 用户确认）</text><text x="40" y="77" font-size="14">仍标为“分类冲突”，由警示色和审核备注要求人工核对；没有经验时按候选顺序预填。</text><rect x="28" y="105" width="1144" height="472" rx="12" fill="white" stroke="#c8dfd1"/><text x="54" y="145" font-size="20" font-weight="bold">验收学习项目_分类审核成果.xlsx</text><text x="54" y="176" font-size="13" fill="#667d74">示例仅展示冲突行的建议、最终分类和备注；真实成果表保留完整10列。</text><rect x="54" y="202" width="1092" height="42" fill="#dce6f1"/><g font-size="14" font-weight="bold"><text x="70" y="229">项目名称</text><text x="214" y="229">项目特征描述</text><text x="444" y="229">自动建议</text><text x="566" y="229">匹配情况</text><text x="696" y="229">最终分类</text><text x="864" y="229">审核备注</text></g><rect x="54" y="244" width="1092" height="106" fill="#fde9d9"/><rect x="681" y="252" width="164" height="50" rx="3" fill="#f4b183" stroke="#e35d00" stroke-width="3"/><g font-size="14"><text x="70" y="286">充电桩配电箱</text><text x="214" y="286">充电桩配套 · 台 · 1</text><text x="444" y="286" fill="#6f7f77">待核对</text><text x="566" y="286" fill="#b15c00" font-weight="bold">分类冲突</text><text x="696" y="286" font-weight="bold">汽车充电桩</text><text x="864" y="278">分类冲突：已按最近</text><text x="864" y="302">学习经验预填，请核对。</text></g><text x="70" y="330" font-size="14" fill="#667d74">来源：验收学习项目 / 强电 / 清单序号待核对（原表第10行）</text><rect x="54" y="362" width="1092" height="66" fill="#fff7d6"/><g font-size="14"><text x="70" y="402">阀门</text><text x="214" y="402">DN50 · 个 · 20</text><text x="444" y="402">阀门</text><text x="566" y="402">匹配成功</text><text x="696" y="402">阀门</text></g><text x="54" y="463" font-size="16" font-weight="bold">预填优先级</text><text x="54" y="493" font-size="14">1. 同一材料的最近有效学习经验　2. 冲突类别自身的最近有效经验　3. 无经验时按分类库候选顺序</text><rect x="54" y="514" width="310" height="40" rx="5" fill="#f4b183"/><text x="68" y="540" font-size="14">最终分类警示色：必须人工核对</text><text x="394" y="540" font-size="14">有学习经验时写明最近经验依据；无经验时写明按候选顺序预填。</text><text x="54" y="583" font-size="13" fill="#667d74">预填只改变成果表内容，不绕过整表一次确认，也不直接写入长期学习库。</text></g></svg>
