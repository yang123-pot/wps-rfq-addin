<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790"><rect width="1100" height="790" fill="#f3f7f5"/><g font-family="Microsoft YaHei, sans-serif" fill="#244235"><text x="36" y="45" font-size="25" font-weight="bold">14 · 分类学习库（按2026-10-20已确认文字方案）</text><text x="36" y="76" font-size="14">独立非模态窗口；关闭本窗口不关闭项目助手。以下为示例数据。</text><rect x="28" y="100" width="1044" height="470" rx="12" fill="white" stroke="#c8dfd1"/><text x="52" y="140" font-size="24" font-weight="bold">分类学习库</text><text x="52" y="169" font-size="14">119个分类 · 6760条经验 · 首屏只取摘要和当前页（每页50条）</text><text x="52" y="211" font-size="18" fill="#008c56">分类管理</text><text x="220" y="211" font-size="18">学习经验</text><path d="M52 225H1036M52 229H156" stroke="#008c56" stroke-width="3"/><text x="52" y="264" font-size="15">搜索名称 / 历史别名　　状态：使用中　　新增分类</text><rect x="52" y="287" width="594" height="156" fill="#f1f7f3"/><text x="68" y="316" font-size="15">选择　分类　　　规则 / 经验　　　操作</text><text x="68" y="354" font-size="15">☑　　给水阀门　　3 / 120　　　　改名 · 归档 · 相似候选</text><text x="68" y="393" font-size="15">□　　水阀门　　　2 / 95　　　　 改名 · 归档 · 相似候选</text><text x="68" y="430" font-size="13">上一页　1 / 3　下一页　　跨页选择源分类；搜索目标分类</text><rect x="670" y="250" width="366" height="240" rx="8" fill="#edf8f1" stroke="#c8dfd1"/><text x="690" y="279" font-size="17" font-weight="bold">合并预览（必须人工确认）</text><text x="690" y="313" font-size="14">给水阀门 → 水阀门</text><text x="690" y="344" font-size="14">迁移规则 / 经验；显示去重数量、别名</text><text x="690" y="375" font-size="14">源分类归档，历史名称保留</text><text x="690" y="406" font-size="14">□ 同时应用到当前未完成项目</text><rect x="690" y="430" width="140" height="38" rx="5" fill="#008c56"/><text x="712" y="455" font-size="15" fill="white">确认合并</text><text x="52" y="486" font-size="15">▶ 高级设置 · 关键词规则（默认折叠）</text><text x="52" y="526" font-size="14">学习经验页：名称 / 特征 / 单位 / 分类 / 时间 / 来源摘要；分页、筛选、按需详情、撤销。</text><text x="52" y="552" font-size="13">归档式删除；有关联规则/经验则提示合并或先清理。相似候选只说明理由，绝不自动合并。</text><rect x="28" y="593" width="1044" height="168" rx="12" fill="white" stroke="#c8dfd1"/><text x="52" y="630" font-size="20" font-weight="bold">第7步：全部拆分并核验成功后</text><text x="52" y="663" font-size="16">是否保存本次分类习惯？　［保存分类习惯］　［不保存］</text><text x="52" y="699" font-size="14">保存全部整表确认分类；名称＋特征＋单位＋类别去重；不保存决定随确认版本保存，重开不重复提示。</text><text x="52" y="731" font-size="14">保存失败单独重试，拆分成果保持成功。整表确认阶段只存项目快照，不立即写长期经验。</text></g></svg>
