<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1666" height="1155" viewBox="0 0 1666 1155">
  <title>浮窗承载补充图：原效果内容保持</title>
  <desc>用户于2026年10月18日批准使用浮窗。下方保留原图01，绿色外框标明操作区改由独立可移动窗口承载；页面内容和底部按钮保持原设计。图02、03、04的流程和业务要求同时保持。</desc>
  <rect width="1666" height="1155" fill="#f3f5f7"/>
  <text x="40" y="48" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#1c2d35">浮窗承载补充 · 内部效果方案保持不变</text>
  <text x="40" y="84" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#4c5a64">只调整窗口外壳，可移动、可调整大小；七步、黄色填写区、固定底部绿色按钮及连续操作仍按图01–04。</text>
  <image x="40" y="105" width="1586" height="992" xlink:href="01-import-preview.png"/>
  <rect x="1145" y="281" width="482" height="781" rx="9" fill="none" stroke="#147b54" stroke-width="5"/>
  <rect x="1146" y="246" width="480" height="34" rx="6" fill="#147b54"/>
  <text x="1162" y="270" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="white">独立操作浮窗 · 内容继续使用原稿</text>
  <text x="40" y="1132" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#4c5a64">设计说明图，非运行截图。浮窗稳定性和全链测试需重新通过，不冒记为原生停靠。</text>
</svg>
