<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f3f7f5"/><g font-family="Microsoft YaHei,sans-serif" fill="#244235"><text x="32" y="40" font-size="24" font-weight="bold">15 · 推荐合并（2026-10-20 用户已确认文字方案）</text><text x="32" y="73" font-size="14">独立学习库内的分类管理；以下数量仅为示例，不是实际库扫描结果。</text><rect x="24" y="96" width="1052" height="670" rx="12" fill="white" stroke="#c8dfd1"/><text x="50" y="136" font-size="24" font-weight="bold">分类学习库</text><text x="50" y="176" fill="#008c56" font-size="18">分类管理</text><text x="230" y="176" font-size="18">学习经验</text><path d="M50 190H1050" stroke="#c8dfd1"/><text x="50" y="230" font-size="20" font-weight="bold">推荐合并 · 系统先整理，用户决定</text><text x="50" y="260" font-size="14">每页10组；优先显示证据充分的候选；名称相似仍需核对，不自动合并。</text><rect x="50" y="284" width="1000" height="237" rx="8" fill="#f0f8f3" stroke="#c8dfd1"/><text x="70" y="316" font-size="20" font-weight="bold">阀门 ↔ 水阀门</text><text x="70" y="347" font-size="14">理由：名称相近、相同材料曾分到两类；双方有效规则/经验及代表材料</text><rect x="70" y="365" width="168" height="38" rx="5" fill="white" stroke="#008c56"/><text x="85" y="390" font-size="15">保留“阀门”</text><rect x="251" y="365" width="188" height="38" rx="5" fill="white" stroke="#bed0c5"/><text x="266" y="390" font-size="15">保留“水阀门”</text><text x="470" y="390" font-size="15">保持独立</text><text x="70" y="435" font-size="14">选定方向后显示迁移 / 去重数量、保留别名；已有确认项目保持。</text><text x="70" y="478" font-size="14">□ 同时应用到当前未完成项目</text><rect x="800" y="452" width="220" height="43" rx="5" fill="#008c56"/><text x="820" y="480" fill="white" font-size="16">确认合并到“阀门”</text><rect x="50" y="539" width="1000" height="90" rx="8" fill="#f7faf8" stroke="#c8dfd1"/><text x="70" y="572" font-size="18">线缆 ↔ 电线电缆</text><text x="70" y="602" font-size="14">仅名称相近：需核对；可保留任一名称，或保持独立后不反复推荐。</text><text x="370" y="663" font-size="15">上一页　1 / …　下一页</text><text x="50" y="704" font-size="15">下方继续分类搜索、新增、改名、归档及手动合并；高级关键词规则仍默认折叠。</text><text x="50" y="738" font-size="13">服务端按版本缓存；页面仅分页建议。保持独立在双方实质证据变化后才重新提示。</text></g></svg>
