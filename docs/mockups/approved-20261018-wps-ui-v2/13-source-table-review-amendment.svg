<text x="84" y="393" font-size="14">建议分类｜最终分类（浅黄可改）｜审核备注</text>
<text x="84" y="414" font-size="13" fill="#596962">另有一列隐藏行标识，仅用于整表核对，不作为公开业务字段。</text>
<text x="64" y="466" font-size="14" fill="#596962">工作表标签顺序、小标题、合并区、列宽和原材料内容均保持。</text>
<text x="64" y="492" font-size="14" fill="#596962">用户在这里填写后，插件统一读取结果，不把原表整理成扁平明细。</text>
<path d="M64 522 L636 522" stroke="#dfe6e2"/>
<text x="64" y="554" font-size="13" fill="#217346">审核副本单独保存；原件和工作副本不变</text>

