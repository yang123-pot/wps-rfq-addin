<text x="744" y="366" font-size="16" font-weight="bold">最终分类保持浅黄色可编辑</text>
<text x="744" y="393" font-size="14">冲突或无可靠建议留空，由用户在原表相同行直接决定。</text>
<text x="744" y="414" font-size="13" fill="#596962">可输入库外新类别，整表确认时统一入库并学习。</text>
<text x="724" y="466" font-size="14" fill="#596962">每本来源仍是独立工作簿；不在预览中把所有原表拼成一张。</text>
<text x="724" y="492" font-size="14" fill="#596962">进入下一步时只需一次整表确认，分类结果汇总到当前项目。</text>
<path d="M724 522 L1336 522" stroke="#dfe6e2"/>
<text x="724" y="554" font-size="13" fill="#217346">仅追加列，不重建原表</text>
</g>
<rect x="40" y="618" width="1320" height="62" rx="8" fill="#e7f2eb"/>
<text x="64" y="646" font-size="16">验收：两份来源＝两份审核副本；原表/工作表顺序和小标题不变；每行只追加建议、最终、备注及隐藏标识。</text>
<text x="64" y="668" font-size="15">读取、整表确认、分类工作簿、品牌、询价和拆分继续使用同一项目链路。</text>
