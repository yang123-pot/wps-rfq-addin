<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f4f7f6"/>
  <text x="55" y="52" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1f2f2b">分类审核成果表 · 布局补充</text>
  <text x="55" y="82" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#5c6b67">合并全部工作簿后，相似材料相邻排列；公开列增加“清单溯源”；第三列改为“项目特征描述”。</text>

  <rect x="55" y="112" width="1490" height="590" rx="8" fill="#ffffff" stroke="#cbd8d3"/>
  <rect x="55" y="112" width="1490" height="54" rx="8" fill="#e8f2ed"/>
