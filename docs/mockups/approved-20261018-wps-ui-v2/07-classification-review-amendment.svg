    <text x="91" y="249">955</text><text x="142" y="249">流量传感器</text>
    <text x="317" y="248">1.名称：流量传感器（显示+报警）</text>
    <text x="607" y="249">个</text><text x="658" y="249">4</text>
    <text x="732" y="248">1-1#特殊实验车间 / 暖通 /</text><text x="732" y="268">清单序号 955（原表第958行）</text>
    <text x="1047" y="249">待核对</text><text x="1153" y="249">分类冲突</text><text x="1250" y="249" fill="#8a6b00">流量计</text>

    <rect x="75" y="304" width="1450" height="77" fill="#fff8e9" stroke="#e6d8b8"/>
