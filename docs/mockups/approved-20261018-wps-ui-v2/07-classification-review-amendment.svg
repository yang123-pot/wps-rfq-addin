  <rect x="75" y="612" width="1450" height="88" fill="#ffffff" stroke="#d7e0dc"/>
  <text x="91" y="642" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#41534d">相似材料以名称和项目特征模糊聚类排列；同组内仍按原清单顺序保留，rowId 与审核确认关系不变。</text>
  <text x="91" y="670" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#41534d">清单溯源来自只读来源快照，合并组显示全部来源；空白或 0 工程量均以 0 参与分类。</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="55" y="732" width="465" height="122" rx="8" fill="#ffffff" stroke="#d5e1dc"/>
    <text x="78" y="765" font-size="19" font-weight="700" fill="#1f6849">1. 相似清单相邻</text>
    <text x="78" y="797" font-size="15" fill="#42544e">按名称与特征做模糊聚类；同组连续排列，</text>
    <text x="78" y="821" font-size="15" fill="#42544e">方便统一审核和填写最终分类。</text>

    <rect x="545" y="732" width="465" height="122" rx="8" fill="#ffffff" stroke="#d5e1dc"/>
    <text x="568" y="765" font-size="19" font-weight="700" fill="#1f6849">2. 清单溯源可反查</text>
    <text x="568" y="797" font-size="15" fill="#42544e">显示来源工程、专业、原清单序号及原表行号；</text>
    <text x="568" y="821" font-size="15" fill="#42544e">合并行列出每一个来源，不丢原始位置。</text>

    <rect x="1035" y="732" width="510" height="122" rx="8" fill="#ffffff" stroke="#d5e1dc"/>
    <text x="1058" y="765" font-size="19" font-weight="700" fill="#1f6849">3. 表头与填写区</text>
    <text x="1058" y="797" font-size="15" fill="#42544e">第三列明确为“项目特征描述”；</text>
    <text x="1058" y="821" font-size="15" fill="#42544e">只有“最终分类”和“审核备注”可编辑。</text>
  </g>
</svg>
