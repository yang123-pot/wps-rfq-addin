    <line x1="1030" y1="184" x2="1030" y2="700" stroke="#d7e0dc"/>
    <line x1="1136" y1="184" x2="1136" y2="700" stroke="#d7e0dc"/>
    <line x1="1232" y1="184" x2="1232" y2="700" stroke="#d7e0dc"/>
    <line x1="1396" y1="184" x2="1396" y2="700" stroke="#d7e0dc"/>
    <text x="91" y="212" font-weight="700">序号</text>
    <text x="142" y="212" font-weight="700">项目名称</text>
    <text x="317" y="212" font-weight="700">项目特征描述</text>
