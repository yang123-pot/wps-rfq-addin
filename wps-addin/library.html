<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分类学习库</title><link rel="stylesheet" href="library.css"></head>
<body><main><header><div><h1>分类学习库</h1><p>维护本机分类与学习经验，供后续项目使用。</p></div><button id="reload">刷新</button></header>
<p id="summary">正在读取摘要…</p><p id="feedback" role="status" aria-live="polite"></p>
<nav role="tablist" aria-label="学习库"><button id="categories-tab" role="tab" aria-selected="true">分类管理</button><button id="memories-tab" role="tab" aria-selected="false">学习经验</button></nav>
<section id="categories-panel"><div class="toolbar"><label>搜索分类<input id="category-search" type="search" placeholder="名称或历史别名"></label><label>状态<select id="category-state"><option value="active">使用中</option><option value="archived">已归档</option><option value="disabled">已停用</option><option value="all">全部</option></select></label></div>
<form id="add-form" class="toolbar"><label>新分类名称<input id="new-name" required maxlength="120"></label><button>新增分类</button></form>
<div class="scroll"><table><thead><tr><th>选择</th><th>分类</th><th>规则 / 经验</th><th>操作</th></tr></thead><tbody id="categories"></tbody></table></div><div id="category-pager" class="pager"></div>
<aside><h2>合并分类</h2><p id="selection">勾选源分类，再搜索并选择目标分类。</p><label>目标分类<select id="merge-target"></select></label><button id="preview-merge">预览合并</button><div id="merge-preview" hidden></div><div id="similar"></div></aside>
<details id="advanced"><summary>高级设置 · 关键词规则</summary><p>关键词以中文或英文逗号分隔。</p><form id="rule-form" class="toolbar"><label>分类<select id="rule-category" required></select></label><label>匹配字段<select id="rule-field"><option value="name">材料名称</option><option value="feature">项目特征</option><option value="text">名称和特征</option></select></label><label>关键词<input id="rule-keywords" required></label><label>排除关键词<input id="rule-exclude"></label><button>新增规则</button></form><ul id="rules"></ul><div id="rule-pager" class="pager"></div></details></section>
<section id="memories-panel" hidden><div class="toolbar"><label>搜索材料<input id="memory-search" type="search" placeholder="名称、特征或单位"></label><label>分类<select id="memory-category"></select></label><label>状态<select id="memory-state"><option value="active">有效经验</option><option value="revoked">已撤销</option><option value="all">全部</option></select></label></div><p>分类筛选来自分类管理的当前搜索页；完整来源按条展开读取。</p><ul id="memories"></ul><div id="memory-pager" class="pager"></div></section>
</main><script src="src/library-window-ui.js"></script></body></html>
